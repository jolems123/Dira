version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dira-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dira_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Kampala2020@&
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dira_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:8.12
    container_name: dira-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@dira.local
      PGADMIN_DEFAULT_PASSWORD: Kampala2020@&
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  pg_data:
  pgadmin_data:
